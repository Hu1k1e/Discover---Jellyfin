name: Build Check

# Compiles the plugin on every push / pull request to main WITHOUT releasing anything,
# so compile errors show up before a version tag is pushed.
on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore NuGet packages
        run: dotnet restore ./Jellyfin.Plugin.UpcomingMovies/Jellyfin.Plugin.UpcomingMovies.csproj

      - name: Build plugin (Release)
        run: dotnet build ./Jellyfin.Plugin.UpcomingMovies/Jellyfin.Plugin.UpcomingMovies.csproj --configuration Release --no-restore
